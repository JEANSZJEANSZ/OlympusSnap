name = "olympus-snap-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "olympus-snap-media"

[[d1_databases]]
binding = "DB"
database_name = "olympus-snap"
# Run: wrangler d1 create olympus-snap — paste the returned database_id here
database_id = "d29a4739-482d-48ec-afd8-df51fa94a679"

[vars]
# Comma-separated extra CORS origins (localhost is always allowed)
CORS_ORIGINS = ""
# Session TTL in milliseconds (24 hours)
SESSION_TTL_MS = "86400000"

[triggers]
crons = ["0 4 * * *"]
